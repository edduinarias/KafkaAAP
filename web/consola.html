<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consola de la demo</title>
  <link rel="stylesheet" href="estilos.css">
  <script>
    try {
      const t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.theme = t;
      if (localStorage.getItem("vista") !== "tecnica") document.documentElement.classList.add("modo-funcional");
    } catch (e) { document.documentElement.classList.add("modo-funcional"); }
  </script>
</head>
<body class="es-consola">
  <header class="banda" id="cabecera"></header>

  <main class="consola">
    <section class="panel cg" id="casos"></section>
    <div class="columna">
      <section class="panel" id="ahora"></section>
      <section class="panel" id="herramientas"></section>
    </div>
  </main>

  <script type="module" src="consola.js"></script>
</body>
</html>
